<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Occupation Summations 1945–1948</title>
<meta name="description" content="A guide to the monthly SCAP Summations of Non-Military Activities in Japan and the USAMGIK Summations for Korea, 1945–1948, with tables of contents linked to page images on the Internet Archive and full-text search of the OCR.">
<style>
:root{--bg:#f3f6f5;--panel:#fff;--ink:#17242a;--muted:#5d6f74;--line:#d9e3e1;--accent:#1d6670;--accent2:#103f46;--chip:#e3eeec;--hl:#f6e27a;--hlb:#cfe6f7;--head:#fff;--band:#1d6670;--bandink:#fff;--jp:#a8323e;--kr:#2f5d9e;--row:#f8fbfa}
body.detail{--bg:#e6efed;--panel:#fbfdfc;--chip:#d8e8e5;--head:#f1f7f6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1719;--panel:#172225;--ink:#e3ecea;--muted:#9bb0b2;--line:#2a3a3e;--accent:#6cc3c9;--accent2:#a9e6e8;--chip:#223236;--hl:#6b5a14;--hlb:#1f4d6b;--head:#172225;--band:#1f5359;--bandink:#e9fbfb;--jp:#f08a92;--kr:#8fb3ef;--row:#131d20}
 :root:not([data-theme=light]) body.detail{--bg:#122024;--panel:#1a2a2e;--chip:#25393d;--head:#1a2a2e}}
:root[data-theme=dark]{--bg:#0f1719;--panel:#172225;--ink:#e3ecea;--muted:#9bb0b2;--line:#2a3a3e;--accent:#6cc3c9;--accent2:#a9e6e8;--chip:#223236;--hl:#6b5a14;--hlb:#1f4d6b;--head:#172225;--band:#1f5359;--bandink:#e9fbfb;--jp:#f08a92;--kr:#8fb3ef;--row:#131d20}
:root[data-theme=dark] body.detail{--bg:#122024;--panel:#1a2a2e;--chip:#25393d;--head:#1a2a2e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Georgia,"Iowan Old Style",serif;transition:background .2s}
header{border-bottom:1px solid var(--line);background:var(--head);position:sticky;top:0;z-index:5}
.band{height:4px;background:linear-gradient(90deg,var(--jp) 0 50%,var(--kr) 50% 100%)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.top{display:flex;gap:12px;align-items:center;padding:12px 0 6px}
h1{font-size:18px;margin:0;font-weight:600;flex:1;min-width:0}
h1 a{color:var(--accent2);text-decoration:none}
nav{display:flex;gap:16px;overflow-x:auto;white-space:nowrap;padding-bottom:8px;scrollbar-width:none}
nav a{color:var(--muted);text-decoration:none;font:14px system-ui,sans-serif;padding:2px 0;border-bottom:2px solid transparent}
nav a.on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
main{padding:34px 0 60px}
a{color:var(--accent)}
input,select{font:14px system-ui,sans-serif;padding:10px 12px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-height:38px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=search]{flex:1;min-width:200px}
button{font:14px system-ui,sans-serif;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;min-height:38px}
button:disabled{opacity:.4;cursor:default}
.meta{color:var(--muted);font:13px system-ui,sans-serif}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 4px;font-weight:600;overflow-wrap:anywhere}
.card h2 a{color:var(--ink);text-decoration:none}.card h2 a:hover{color:var(--accent)}
body.detail .card.rep{border-top:4px solid var(--accent)}
body.detail .card.rep.J{border-top-color:var(--jp)}body.detail .card.rep.K{border-top-color:var(--kr)}
body.detail .card.rep>h2{font-size:20px;color:var(--accent2)}
.searchbar{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 20px}
.label{font:600 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:18px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chip{background:var(--chip);border-radius:12px;padding:2px 9px;font:12.5px system-ui,sans-serif;color:var(--ink);text-decoration:none}
a.chip:hover{outline:1px solid var(--accent)}
.ser{display:inline-block;border-radius:4px;padding:0 6px;font:700 11px/1.7 system-ui,sans-serif;letter-spacing:.04em;color:#fff;vertical-align:1px}
.ser.J{background:var(--jp)}.ser.K{background:var(--kr)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ser{color:#0f1719}}
:root[data-theme=dark] .ser{color:#0f1719}
.var.bur{border-color:var(--kr);color:var(--ink)}.var.bur a{color:inherit}
.var{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 7px;font:12px/1.6 system-ui,sans-serif;color:var(--muted);white-space:nowrap}
.pgpill{display:inline-block;border-radius:999px;padding:0 8px;font:600 12px/1.65 system-ui,sans-serif;white-space:nowrap;background:var(--chip);color:var(--accent2);text-decoration:none}
a.pgpill:hover{background:var(--accent);color:var(--bandink)}
.llm{display:inline-block;font:500 10px/1.5 system-ui,sans-serif;font-style:normal;color:var(--muted);background:var(--chip);border-radius:8px;padding:0 6px;vertical-align:1px;white-space:nowrap;opacity:.85}
mark{background:var(--hlb);color:inherit;border-radius:2px}h2 mark,h3 mark,.sec-t mark{background:var(--hl)}
.note{padding:10px 12px;border-radius:8px;background:var(--chip);border-left:4px solid var(--accent);font:14px system-ui,sans-serif;margin:0 0 14px}
/* cover: table of contents of the whole run */
.intro{font-size:16px;max-width:760px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:13px system-ui,sans-serif;color:var(--muted)}
.stat b{display:block;font:600 20px Georgia,serif;color:var(--ink)}
.toc-year{margin:26px 0 8px;font:600 22px Georgia,serif;color:var(--accent2);display:flex;align-items:baseline;gap:12px}
.toc-year span{font:13px system-ui,sans-serif;color:var(--muted)}
.toc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.toc-h,.toc-r{display:grid;grid-template-columns:120px 1fr 1fr}
.toc-h{background:var(--chip);font:600 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.toc-h>div{padding:7px 12px}
.toc-r{border-top:1px solid var(--line)}
.toc-r:nth-child(odd){background:var(--row)}
.toc-m{padding:10px 12px;font:600 14px system-ui,sans-serif;color:var(--accent2)}
.toc-c{padding:8px 12px;min-width:0;border-left:1px solid var(--line)}
.toc-c.empty{color:var(--muted);font:13px system-ui,sans-serif;font-style:italic}
.iss{margin:0 0 6px}.iss:last-child{margin:0}
.iss>a{font-weight:600;text-decoration:none;color:var(--ink)}.iss>a:hover{color:var(--accent)}
.iss .meta{display:inline}
.iss details{margin:3px 0 0}
.iss summary{cursor:pointer;font:13px system-ui,sans-serif;color:var(--accent);list-style:none}
.iss summary::-webkit-details-marker{display:none}
.iss summary::before{content:"▸ ";display:inline-block;transition:transform .15s}
.iss details[open] summary::before{transform:rotate(90deg)}
.minitoc{margin:4px 0 2px;padding:0;list-style:none;font:13px/1.45 system-ui,sans-serif}
.minitoc li{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.minitoc li.l2{padding-left:14px}.minitoc li.l3{padding-left:28px;font-size:12.5px}
.minitoc a{color:var(--ink);text-decoration:none;flex:1;min-width:0}.minitoc a:hover{color:var(--accent)}
.minitoc .pp{color:var(--muted);font-size:12px;white-space:nowrap;flex:none}
@media (max-width:700px){.toc-h{display:none}.toc-r{grid-template-columns:1fr}.toc-m{padding:10px 12px 0}.toc-c{border-left:0}
 .toc-c::before{content:attr(data-s);display:block;font:600 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}}
/* report page */
.sec{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:9px 0;scroll-margin-top:150px}
.sec.l2{padding-left:18px}.sec.l3{padding-left:36px}
.sec>div{flex:1;min-width:0}
.sec-t{font-weight:600;color:var(--accent2);text-decoration:none}a.sec-t:hover{text-decoration:underline}
.sec.l1 .sec-t{font-size:16px}
.sec .s{margin:2px 0 0;font-size:14px}
.sec.on{background:color-mix(in srgb,var(--accent) 10%,transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
.sec.on.l2{padding-left:34px}.sec.on.l3{padding-left:52px}
.sec .side{flex:none;text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
ul.hl{margin:4px 0 0;padding-left:20px}ul.hl li{margin:2px 0}
.pn{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin:14px 0 0;font:14px system-ui,sans-serif}
/* full text */
.fthead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.ftrep{margin:0 0 12px}
.fthit{padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.fthit .ftx{color:var(--ink)}
.fthit .meta a{font-weight:600}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.hist a{font:12.5px system-ui,sans-serif}
.list-r{border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.theme{flex:none;min-height:34px;padding:4px 10px}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--muted);font:13px system-ui,sans-serif}
</style>
</head>
<body>
<header><div class="band"></div><div class="wrap">
 <div class="top"><h1><a href="#">Occupation Summations, Japan &amp; Korea 1945–1948</a></h1>
  <button class="theme" id="theme" title="Switch light/dark">◐</button></div>
 <nav id="nav"><a href="#" data-v="cover">Contents</a><a href="#reports" data-v="reports">Search reports</a><a href="#fulltext" data-v="fulltext">Full text</a><a href="#about" data-v="about">About</a></nav>
</div></header>
<main class="wrap" id="main"></main>
<footer class="wrap">Page images: <a href="https://archive.org/search?query=subject%3A%22non-military-summation%22+OR+subject%3A%22usamgik-monthly%22">Internet Archive</a>. Summaries and section lists are written by language models from OCR text and marked <span class="llm">by LLM</span>; check them against the page images.</footer>
<script src="data.js"></script>
<script>
const D = window.CATALOG || [], BY = Object.fromEntries(D.map(x => [x.id, x]));
const $ = s => document.querySelector(s), main = $('#main');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IA = id => 'https://archive.org/details/' + id;
const IAP = (x, p) => IA(x.ia) + '/page/n' + ((p || 1) - 1) + '/mode/1up';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SER = {J: 'Japan', K: 'Korea'};
const SERLONG = {J: 'SCAP · Non-Military Activities in Japan', K: 'USAMGIK · Military Government in Korea'};
const mon = d => MONTHS[+d.slice(5, 7) - 1];
const when = x => mon(x.d) + (x.d2 ? '–' + mon(x.d2) : '') + ' ' + x.d.slice(0, 4);
const LLM = by => `<span class="llm" title="${esc(by ? 'Written by ' + by : 'Machine-written')} from OCR text">by LLM</span>`;
const ser = s => `<span class="ser ${s}">${SER[s]}</span>`;
const pgPill = n => `<span class="pgpill">${n} pp.</span>`;
const ppLink = (x, p) => `<a class="pgpill" href="${IAP(x, p[0])}" target="_blank" rel="noopener" title="Open on archive.org">${p[0] === p[1] ? 'p. ' + p[0] : 'pp. ' + p[0] + '–' + p[1]}</a>`;
const short = x => `${SER[x.s]} No. ${x.no}${x.v ? ' (' + x.v + ')' : ''}`;
const set = h => { if (location.hash !== h) history.replaceState(null, '', h || '#'); };

// theme
(() => { let t = null; try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = () => { const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('theme', document.documentElement.dataset.theme); } catch (e) {} }; })();

// search helpers for the catalogue
D.forEach(x => { x.blob = [x.t, x.o, (x.h || []).join(' '), (x.k || []).join(' '), (x.toc || []).map(s => s.t + ' ' + s.s).join(' ')].join(' ').toLowerCase(); });
function terms(q) { const out = []; q.replace(/"([^"]+)"|(\S+)/g, (m, a, b) => out.push((a || b).toLowerCase())); return out; }
function hl(s, ts) { s = esc(s); if (!ts.length) return s;
  const rx = new RegExp('(' + ts.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi'); return s.replace(rx, '<mark>$1</mark>'); }

function nav(v) { document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v)); document.body.classList.toggle('detail', v === 'detail'); }

// ---------- cover: table of contents of the whole run ----------
function miniToc(x) {
  if (x.sk) return '';
  const rows = x.toc.filter(s => s.lv <= 2);
  return `<details><summary>Contents (${rows.length})</summary><ul class="minitoc">${rows.map((s, i) =>
    `<li class="l${s.lv}"><a href="${IAP(x, s.p[0])}" target="_blank" rel="noopener" title="Open p. ${s.p[0]} on archive.org">${esc(s.t)}</a><a class="pp" href="#d/${x.id}/s/${x.toc.indexOf(s) + 1}" title="Section in this guide">p. ${s.p[0]}</a></li>`).join('')}</ul></details>`;
}
function issue(x) {
  const v = x.host ? `<span class="var bur">${x.kind === 'misbound' ? 'misbound pages in' : 'bound in'} <a href="#d/${x.host}">${esc(x.host)}</a>, pp. ${x.rg.map(r => r.join('–')).join(', ')}</span> `
    : x.v ? `<span class="var">${esc(x.v)}</span> ` : '';
  return `<div class="iss"><a href="#d/${x.id}">No. ${x.no}</a> ${v}<span class="meta">${x.pg} pp.${x.sk ? ' · not yet catalogued' : ''}</span>${miniToc(x)}</div>`;
}
function cover() {
  nav('cover'); document.title = 'Occupation Summations 1945–1948';
  const months = [...new Set(D.map(x => x.d))].sort();
  const last = D.reduce((a, x) => (x.d2 || x.d) > a ? (x.d2 || x.d) : a, '');
  const all = []; for (let y = 1945, m = 9; `${y}-${String(m).padStart(2, '0')}` <= last; m === 12 ? (y++, m = 1) : m++) all.push(`${y}-${String(m).padStart(2, '0')}`);
  const cov = d => D.filter(x => x.d === d || (x.d2 && x.d < d && d <= x.d2));
  const cell = (d, s) => { const xs = cov(d).filter(x => x.s === s);
    if (xs.length) return xs.every(x => x.d !== d) ? `<div class="toc-c empty" data-s="${SER[s]}">see ${mon(xs[0].d)}</div>` : `<div class="toc-c" data-s="${SER[s]}">${xs.map(issue).join('')}</div>`;
    const gap = s === 'K' && d < '1946-03' ? 'reported in the Japan Summation' : 'not in this collection';
    return `<div class="toc-c empty" data-s="${SER[s]}">${gap}</div>`; };
  const years = [...new Set(all.map(d => d.slice(0, 4)))];
  const pages = D.filter(x => !x.host).reduce((a, x) => a + x.pg, 0);
  main.innerHTML = `<p class="intro">Every month from September 1945, General Headquarters of the Supreme Commander for the Allied Powers (SCAP) issued a <i>Summation of Non-Military Activities</i> on the Occupation of Japan: government, the economy, labour, health, education, religion and the press. Southern Korea was covered in the same report until February 1946, and from March 1946 in a separate monthly summation of U.S. Army Military Government activities, renamed <i>South Korean Interim Government Activities</i> in July 1947. This guide sets the two series side by side, with each report's table of contents linked to its page images on the Internet Archive and full-text search of the OCR text.</p>
  <div class="searchbar" style="margin-top:14px"><input type="search" id="cq" placeholder="Search the full text of all ${pages.toLocaleString()} pages…"><button id="cgo">Search</button></div>
  ${years.map(y => `<div class="toc-year">${y}<span>${D.filter(x => x.d.startsWith(y)).length} PDFs</span></div>
   <div class="toc"><div class="toc-h"><div>Month</div><div>${ser('J')} SCAP</div><div>${ser('K')} USAMGIK</div></div>
   ${all.filter(d => d.startsWith(y)).map(d => `<div class="toc-r"><div class="toc-m">${mon(d)}</div>${cell(d, 'J')}${cell(d, 'K')}</div>`).join('')}</div>`).join('')}`;
  const go = () => { const q = $('#cq').value.trim(); if (q) location.hash = '#fulltext/' + encodeURIComponent(q); };
  $('#cgo').onclick = go; $('#cq').onkeydown = e => { if (e.key === 'Enter') go(); };
}

// ---------- report page ----------
function report(id, mode, arg) {
  const x = BY[id]; if (!x) { main.innerHTML = '<p>Report not found. <a href="#">Back to contents</a></p>'; return; }
  nav('detail'); document.title = short(x) + ' · ' + when(x);
  const ts = mode === 'q' ? terms(arg) : [];
  const page = mode === 'pg' ? +arg : 0, sn = mode === 's' ? +arg : 0;
  const same = D.filter(y => y.s === x.s), i = same.indexOf(x);
  const alts = D.filter(y => y !== x && y.s === x.s && y.no === x.no);
  const other = D.filter(y => y.s !== x.s && y.d === x.d);
  let on = sn ? sn - 1 : -1;
  if (page) x.toc.forEach((s, j) => { if (s.p[0] <= page && page <= s.p[1] && (on < 0 || s.lv >= x.toc[on].lv)) on = j; });
  main.innerHTML = `<a class="meta" href="#">← Contents</a>
  <div class="card rep ${x.s}" style="margin-top:10px"><h2>${esc(x.t)}</h2>
   <div class="meta">${ser(x.s)} ${esc(SERLONG[x.s])} · ${when(x)} · ${pgPill(x.pg)}${x.v ? ' · <span class="var">' + esc(x.v) + '</span>' : ''} · <a href="${x.host ? IAP(x, x.rg[0][0]) : IA(x.ia)}" target="_blank" rel="noopener">${x.host ? 'archive.org (opens at p. ' + x.rg[0][0] + ')' : 'archive.org'}</a> · <a href="https://archive.org/download/${x.ia}" target="_blank" rel="noopener">download${x.host ? ' the whole volume' : ''}</a> · <a href="#fulltext/in:${x.id}%20">search this report's text</a></div>
   ${x.host ? `<div class="note" style="margin-top:10px">${x.kind === 'misbound' ? 'These pages were misbound into' : 'This issue is bound inside'} <a href="#d/${x.host}"><b>${esc(short(BY[x.host]))}</b></a>, PDF pages ${x.rg.map(r => `<a href="${IAP(x, r[0])}" target="_blank" rel="noopener">${r.join('–')}</a>`).join(', ')}. <span class="meta">How it was found: ${esc(x.found)}.</span></div>` : ''}
   ${x.emb ? `<div class="note" style="margin-top:10px">This volume also contains: ${x.emb.map(e => BY[e]).map(e => `<a href="#d/${e.id}"><b>${esc(e.t)}</b></a> (${e.kind === 'misbound' ? 'misbound pages, ' : ''}pp. ${e.rg.map(r => `<a href="${IAP(e, r[0])}" target="_blank" rel="noopener">${r.join('–')}</a>`).join(', ')})`).join('; ')}. Their sections are listed on their own pages.</div>` : ''}
   ${page ? `<div class="note" style="margin-top:10px">Page ${page}${on >= 0 ? ' is in <b>' + esc(x.toc[on].t) + '</b>' : ''} · <a href="${IAP(x, page)}" target="_blank" rel="noopener">open page ${page} on archive.org</a></div>` : ''}
   ${x.sk ? `<p class="note" style="margin-top:12px">This report has not been catalogued yet. Its full text is searchable: <a href="#fulltext/in:${x.id}%20">search inside it</a>.</p>` : `
   <div class="label">Summary</div><p style="margin:0">${hl(x.o, ts)} ${LLM(x.by)}</p>
   ${x.h.length ? `<div class="label">Highlights</div><ul class="hl">${x.h.map((h, i) => `<li>${hl(h, ts)}${i === x.h.length - 1 ? ' ' + LLM(x.by) : ''}</li>`).join('')}</ul>` : ''}
   ${x.k.length ? `<div class="chips" style="margin-top:12px">${x.k.map(k => `<a class="chip" href="#reports/${encodeURIComponent('"' + k + '"')}">${esc(k)}</a>`).join('')}</div>` : ''}
   <div class="label">Table of contents <span class="llm">page numbers are PDF pages</span></div>
   <div id="toc">${x.toc.map((s, j) => `<div class="sec l${s.lv}${j === on ? ' on' : ''}" id="s${j + 1}"><div><a class="sec-t" href="${IAP(x, s.p[0])}" target="_blank" rel="noopener" title="Open p. ${s.p[0]} on archive.org">${hl(s.t, ts)}</a>${s.pp ? ` <span class="meta">(printed p. ${esc(s.pp)})</span>` : ''}${s.s ? `<p class="s">${hl(s.s, ts)} ${LLM(x.by)}</p>` : ''}</div>
     <div class="side">${ppLink(x, s.p)}<a class="meta" href="#fulltext/in:${x.id}%23${j + 1}%20" title="Search the text of this section">search</a></div></div>`).join('')}</div>`}
   <div class="pn"><span>${i > 0 ? `← <a href="#d/${same[i - 1].id}">${esc(short(same[i - 1]))}, ${when(same[i - 1])}</a>` : ''}</span>
    <span>${alts.map(y => `Also: <a href="#d/${y.id}">${esc(short(y))}</a>`).join(' · ')}${other.length ? (alts.length ? ' · ' : '') + 'Same month: ' + other.map(y => `<a href="#d/${y.id}">${esc(short(y))}</a>`).join(' · ') : ''}</span>
    <span>${i < same.length - 1 ? `<a href="#d/${same[i + 1].id}">${esc(short(same[i + 1]))}, ${when(same[i + 1])}</a> →` : ''}</span></div>
  </div>`;
  const el = on >= 0 && document.getElementById('s' + (on + 1));
  if (el) el.scrollIntoView({block: 'center'}); else scrollTo(0, 0);
}

// ---------- catalogue search ----------
function reports(q) {
  nav('reports'); document.title = 'Search reports · Occupation Summations';
  main.innerHTML = `<div class="searchbar"><input type="search" id="rq" placeholder='Search summaries and contents, e.g. labor union, "rice ration"' value="${esc(q)}"><select id="rs"><option value="">Both series</option><option value="J">Japan</option><option value="K">Korea</option></select></div><div id="rres"></div>
  <p class="meta">This searches the catalogue (summaries, highlights, keywords and section titles). To search every word of the reports, use <a href="#fulltext">Full text</a>.</p>`;
  const run = () => { const v = $('#rq').value.trim(), s = $('#rs').value, ts = terms(v);
    set(v ? '#reports/' + encodeURIComponent(v) : '#reports');
    const hits = D.filter(x => (!s || x.s === s) && ts.every(t => x.blob.includes(t)));
    $('#rres').innerHTML = `<p class="meta">${hits.length} of ${D.length} reports${D.some(x => x.sk) ? ` (${D.filter(x => x.sk).length} not yet catalogued)` : ''}</p>` + hits.map(x => {
      const secs = ts.length ? x.toc.map((sec, j) => [sec, j]).filter(([sec]) => ts.some(t => (sec.t + ' ' + sec.s).toLowerCase().includes(t))) : [];
      return `<div class="card"><h2><a href="#d/${x.id}${ts.length ? '/q/' + encodeURIComponent(v) : ''}">${hl(x.t, ts)}</a></h2>
       <div class="meta">${ser(x.s)} ${when(x)} · ${pgPill(x.pg)}${x.v ? ' · ' + esc(x.v) : ''}${x.sk ? ' · not yet catalogued' : ''}</div>
       ${x.o ? `<p style="margin:6px 0 0;font-size:14px">${hl(x.o, ts)} ${LLM(x.by)}</p>` : ''}
       ${secs.map(([sec, j]) => `<div class="list-r"><a href="#d/${x.id}/s/${j + 1}">${hl(sec.t, ts)}</a> ${ppLink(x, sec.p)}<div class="meta">${hl(sec.s, ts)} ${LLM(x.by)}</div></div>`).join('')}</div>`; }).join('');
  };
  $('#rq').oninput = run; $('#rs').onchange = run; run(); $('#rq').focus();
}

// ---------- full text (Pagefind) ----------
let PF = null;
async function pf() { if (!PF) { PF = await import('./pagefind/pagefind.js'); await PF.options({excerptLength: 26}); PF.init(); } return PF; }
function parseFT(q) {  // in:<report id>[#<section>]  series:japan|korea  year:1946
  const f = {}; let scope = null;
  q = q.replace(/(^|\s)in:(\S+)/i, (m, a, v) => { scope = v; return ' '; })
       .replace(/(^|\s)series:(\S+)/i, (m, a, v) => { f.series = /^k/i.test(v) ? 'Korea (USAMGIK)' : 'Japan (SCAP)'; return ' '; })
       .replace(/(^|\s)year:(\d{4})/i, (m, a, v) => { f.year = v; return ' '; }).trim();
  if (scope) { const [rid, sec] = scope.split('#'); if (BY[rid]) { if (sec) f.sec = rid + '#' + sec; else f.doc = rid; } }
  return {q, f, scope};
}
async function fulltext(q) {
  nav('fulltext'); document.title = 'Full text · Occupation Summations';
  q = q || '';
  main.innerHTML = `<div class="searchbar"><input type="search" id="fq" value="${esc(q)}" placeholder='Words or "a phrase"; add in:J-16, series:korea or year:1947'><button id="fgo">Search</button></div>
  <div id="fres"><p class="meta">Searches the OCR text of every page. Words must all occur on the same page. Filters: <code>series:japan</code> or <code>series:korea</code>, <code>year:1947</code>, <code>in:J-16</code> (one report; IDs are shown on report pages, e.g. <code>K-30</code>, <code>J-04-phw</code>).</p></div>`;
  const go = () => { const v = $('#fq').value.trim(); set(v ? '#fulltext/' + encodeURIComponent(v) : '#fulltext'); search(v); };
  $('#fgo').onclick = go; $('#fq').onkeydown = e => { if (e.key === 'Enter') go(); };
  if (q) search(q); else $('#fq').focus();
}
let ftSeq = 0;
async function search(raw) {
  const my = ++ftSeq, out = $('#fres');
  const {q, f, scope} = parseFT(raw);
  if (!q) { out.innerHTML = '<p class="meta">Type at least one word.</p>'; return; }
  out.innerHTML = '<p class="meta">Searching…</p>';
  let p; try { p = await pf(); } catch (e) { out.innerHTML = '<p class="note">The full-text index could not be loaded. It needs the site to be served over http(s), not opened as a file.</p>'; return; }
  const r = await p.search(q, {filters: f, sort: {date: 'asc'}});
  if (my !== ftSeq) return;
  const n = r.results.length;
  if (!n) { out.innerHTML = `<p class="meta">No pages match${scope ? ' in ' + esc(scope) : ''}.</p>`; return; }
  const LIMIT = 400, data = await Promise.all(r.results.slice(0, LIMIT).map(x => x.data()));
  if (my !== ftSeq) return;
  const groups = []; const gi = {};
  data.forEach(d => { const id = d.meta.id; if (!(id in gi)) { gi[id] = groups.length; groups.push({id, pages: []}); } groups[gi[id]].pages.push(d); });
  const cnt = r.filters && r.filters.doc || {}, yrs = r.filters && r.filters.year || {};
  const reps = Object.keys(cnt).filter(k => cnt[k] && !(BY[k] && BY[k].emb && BY[k].emb.reduce((a, e) => a + (cnt[e] || 0), 0) >= cnt[k])).length || groups.length;
  out.innerHTML = `<p class="meta">${n.toLocaleString()} page${n === 1 ? '' : 's'} in ${reps} report${reps === 1 ? '' : 's'}${scope ? ' · within ' + esc(scope) : ''}${n > LIMIT ? ` · showing the first ${LIMIT} pages by date` : ''}</p>
   ${!f.year ? `<div class="hist">${Object.entries(yrs).filter(([, c]) => c).map(([y, c]) => `<a class="chip" href="#fulltext/${encodeURIComponent(raw + ' year:' + y)}">${y} <b>${c}</b></a>`).join('')}</div>` : ''}
   ${groups.map(g => { const x = BY[g.id], tot = ((cnt[g.id] || 0) - (x.emb || []).reduce((a, e) => a + (cnt[e] || 0), 0)) || g.pages.length;  // a host's doc count includes its buried issues
     return `<div class="card ftrep"><h2><a href="#d/${x.id}">${esc(short(x))}, ${when(x)}</a></h2>
      <div class="meta">${ser(x.s)} ${tot} matching page${tot === 1 ? '' : 's'} · ID <code>${x.id}</code>${!scope ? ` · <a href="#fulltext/${encodeURIComponent(q + ' in:' + x.id)}">only this report</a>` : ''}</div>
      ${g.pages.map(d => `<div class="fthit"><span class="meta"><a href="${IAP(x, +d.meta.page)}" target="_blank" rel="noopener" title="Page image on archive.org">p. ${esc(d.meta.page)}</a>${d.meta.sec ? ` · <a href="#d/${x.id}/pg/${esc(d.meta.page)}">${esc(d.meta.sec)}</a>` : ` · <a href="#d/${x.id}/pg/${esc(d.meta.page)}">in report</a>`}</span> <span class="ftx">…${d.excerpt}…</span></div>`).join('')}</div>`; }).join('')}`;
}

// ---------- about ----------
function about() {
  nav('about'); document.title = 'About · Occupation Summations';
  const J = D.filter(x => x.s === 'J'), K = D.filter(x => x.s === 'K');
  main.innerHTML = `<div class="card"><h2>About this guide</h2>
  <p>The <b>Summation of Non-Military Activities in Japan</b> (Nos. 1–35, September 1945 – August 1948) was the monthly report of General Headquarters, Supreme Commander for the Allied Powers (GHQ/SCAP). Nos. 1–5 also covered southern Korea. From March 1946 Korea had its own monthly report, the <b>Summation of United States Army Military Government Activities in Korea</b> (Nos. 6–21), continued from July 1947 as <b>South Korean Interim Government Activities</b> (Nos. 22–34).</p>
  <p>This collection has ${J.length} Japan PDFs and ${K.length} Korea PDFs. Some issues exist in more than one copy (a second scan, or a separately bound section such as Public Health and Welfare); each copy is listed. Not in this collection: Japan No. 2 (November 1945) and No. 21 (June 1947); of Korea No. 23, only part 1.</p>
  <div class="label">How it was made</div>
  <ul><li>Page images are on the <a href="https://archive.org/search?query=subject%3A%22non-military-summation%22+OR+subject%3A%22usamgik-monthly%22">Internet Archive</a>; every page reference here links there. Page numbers are PDF page numbers, not the reports' printed page numbers.</li>
  <li>Text: Mistral OCR (mistral-ocr-4-1) of every page. OCR has errors, especially in tables; check the page image.</li>
  <li>Summaries, highlights, keywords and tables of contents were written by language models (Gemini and Claude, via Antigravity) from the OCR text, and are marked <span class="llm">by LLM</span>.</li>
  <li>Full-text search uses <a href="https://pagefind.app/">Pagefind</a>; it runs in your browser with no server.</li></ul>
  <div class="label">Search tips</div>
  <ul><li><b>Full text:</b> all words must be on the same page. Add <code>series:korea</code>, <code>year:1947</code> or <code>in:K-30</code> to narrow it.</li>
  <li><b>Search reports:</b> searches the catalogue only (summaries, section titles), and lists matching sections.</li>
  <li>Links can be shared: the address bar keeps the report, page or search.</li></ul></div>`;
}

// ---------- router ----------
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = h.match(/^d\/([^/]+)(?:\/(pg|s|q)\/(.+))?$/))) report(m[1], m[2], m[3]);
  else if ((m = h.match(/^reports(?:\/(.*))?$/))) reports(m[1] || '');
  else if ((m = h.match(/^fulltext(?:\/(.*))?$/))) fulltext(m[1] || '');
  else if (h === 'about') about();
  else { cover(); scrollTo(0, 0); }
}
addEventListener('hashchange', route); route();
</script>
</body>
</html>
